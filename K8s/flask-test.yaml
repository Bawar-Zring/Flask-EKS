apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-test
  labels:
    app: flask-deploy-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-temp-test
  template:
    metadata:
      labels:
        app: flask-temp-test
    spec:
      containers:
        - name: flask-test
          image: b4w4rzr1ng/flask-app-alb:alb-ingress2
          ports:
            - containerPort: 5000
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: credentials
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: "testdb"
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: aws-endpoints-1
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              value: "5432"
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: aws-endpoints-1
                  key: REDIS_HOST
            - name: REDIS_PORT
              value: "6379"
          volumeMounts:
            - mountPath: /data
              name: data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pvc
---
apiVersion: v1
kind: Service
metadata:
  name: flask-service-test
spec:
  selector:
    app: flask-temp-test
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  type: ClusterIP